name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Test .NET projects and rendered layouts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet test ./tests/PrivateType.Core.Tests/PrivateType.Core.Tests.csproj --configuration Release
          dotnet test ./tests/PrivateType.App.Tests/PrivateType.App.Tests.csproj --configuration Release
          dotnet test ./tests/PrivateType.EngineProbe.Tests/PrivateType.EngineProbe.Tests.csproj --configuration Release
          dotnet run --project ./tests/PrivateType.App.LayoutProbe/PrivateType.App.LayoutProbe.csproj --configuration Release
