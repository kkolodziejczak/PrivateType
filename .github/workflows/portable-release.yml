name: Build portable PrivateType

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  portable-release:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned NeMo-Speech.cpp source
        shell: pwsh
        run: |
          git clone https://github.com/NVIDIA/NeMo-Speech.cpp.git .engine/NeMo-Speech.cpp
          git -C .engine/NeMo-Speech.cpp checkout 1118951337094db3b362fbf1b27e871696f10590

      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: |
            .engine/vcpkg
            .engine/build-cpu-realtime-manual
          key: native-win-x64-v3-${{ hashFiles('Build-NemoSpeechCpu.ps1', 'patches/nemo-speech-windows-sentencepiece-absl.patch') }}
          restore-keys: |
            native-win-x64-
      - name: Build CPU speech runtime
        shell: pwsh
        run: ./Build-NemoSpeechCpu.ps1

      - name: Test .NET projects and rendered layouts
        shell: pwsh
        run: |
          dotnet test ./tests/PrivateType.Core.Tests/PrivateType.Core.Tests.csproj --configuration Release
          dotnet test ./tests/PrivateType.App.Tests/PrivateType.App.Tests.csproj --configuration Release
          dotnet run --project ./tests/PrivateType.App.LayoutProbe/PrivateType.App.LayoutProbe.csproj --configuration Release

      - name: Build and verify portable ZIP
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+(?:\.\d+)?)(?:[-+].+)?$') { $Matches[1] } else { '0.0.0' }
          ./Build-PortableRelease.ps1 -Version $version
          ./Test-PortableRelease.ps1 -ExpectedVersion $version
          $hash = (Get-FileHash ./artifacts/PrivateType-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PrivateType-win-x64.zip" | Set-Content ./artifacts/PrivateType-win-x64.zip.sha256 -NoNewline

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrivateType-win-x64
          path: |
            artifacts/PrivateType-win-x64.zip
            artifacts/PrivateType-win-x64.zip.sha256
          if-no-files-found: error

      - name: Create GitHub draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME ./artifacts/PrivateType-win-x64.zip ./artifacts/PrivateType-win-x64.zip.sha256 --draft --generate-notes
