name: Bug report
description: Report a reproducible PrivateType problem without private speech data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include dictated text, audio, microphone names, settings files, or unreviewed diagnostics."
  - type: input
    id: version
    attributes:
      label: PrivateType version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
