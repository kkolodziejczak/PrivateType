name: Feature request
description: Suggest an improvement to PrivateType.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user outcome, not only an implementation idea.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
